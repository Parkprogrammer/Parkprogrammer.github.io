# Site settings
title: "Jehyun Park"
description: "Machine Learning Researcher & Computer Science Engineer"
url: "https://parkprogrammer.github.io"
baseurl: ""

# Build settings
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  input: GFM
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  style: compressed

# Collections
collections:
  blog:
    output: true
    permalink: /blog/:name/
  publications:
    output: true
    permalink: /publications/:name/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Files excluded from the build output
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - package.json
  - package-lock.json
  - node_modules
